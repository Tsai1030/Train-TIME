<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>鐵道脈 PULSE</title>
    <link rel="icon" type="image/svg+xml" href="/train_logo_icon.svg" />
    <link rel="apple-touch-icon" href="/train_logo_icon.svg" />
    <meta name="theme-color" content="#0c0c0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function(){
        try {
          var c = JSON.parse(localStorage.getItem('pulse-theme'));
          var t = c && c.theme || 'dark';
          if (t === 'auto') { var h = new Date().getHours(); t = (h >= 6 && h < 18) ? 'light' : 'dark'; }
          var bg = t === 'light' ? '#f4f4f6' : '#0c0c0f';
          document.documentElement.style.background = bg;
          document.documentElement.setAttribute('data-theme', t);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        } catch(e) {
          document.documentElement.style.background = '#0c0c0f';
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
